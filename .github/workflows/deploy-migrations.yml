name: Deploy Supabase Migrations

# Runs only when migration files change on main — DB schema changes must not
# ride along with every unrelated push, and must never run against preview
# builds. Separate from the Vercel app deploy: migrations are the linked
# Supabase project's state, not the app's build artifact.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref xamdgvxziobpptcfymug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Baseline migration history (one-time repair)
        # 001-007 were applied directly via the Supabase SQL editor before this workflow
        # existed, so the CLI's migration history table never recorded them — confirmed by
        # inspecting the live schema (private schema, task_assignments.member_sort_key both
        # present; next_sort_key absent, i.e. exactly the pre-008 state). This marks them as
        # applied to match reality, and retires an orphan remote entry with no local file.
        # Remove this step after it succeeds once — future runs only need `db push`.
        run: |
          supabase migration repair --status applied 001 002 003 004 005 006 007
          supabase migration repair --status reverted 20260725220330
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
