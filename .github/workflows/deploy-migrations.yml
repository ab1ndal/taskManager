name: Deploy Supabase Migrations

# Runs only when migration files change on main — DB schema changes must not
# ride along with every unrelated push, and must never run against preview
# builds. Separate from the Vercel app deploy: migrations are the linked
# Supabase project's state, not the app's build artifact.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref xamdgvxziobpptcfymug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Diagnose migration history (temporary)
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Inspect remote schema (temporary, read-only)
        run: |
          supabase db dump --linked --schema public,private -f /tmp/schema.sql
          echo "--- private schema present? ---"
          grep -c "CREATE SCHEMA.*private" /tmp/schema.sql || true
          echo "--- member_sort_key column? ---"
          grep -c "member_sort_key" /tmp/schema.sql || true
          echo "--- next_sort_key function (should be absent pre-008)? ---"
          grep -c "next_sort_key" /tmp/schema.sql || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
