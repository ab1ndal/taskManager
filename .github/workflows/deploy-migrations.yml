name: Deploy Supabase Migrations

# Runs only when migration files change on main — DB schema changes must not
# ride along with every unrelated push, and must never run against preview
# builds. Separate from the Vercel app deploy: migrations are the linked
# Supabase project's state, not the app's build artifact.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref xamdgvxziobpptcfymug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Logged before the push so a history mismatch reads as "remote is missing 001-006" rather
      # than as an opaque failure on a `create table` that already exists. If this ever shows local
      # migrations the remote does not have but the schema does, run repair-migration-history.yml
      # rather than letting the push replay them. See tasks/lessons.md L9.
      - name: Show migration history
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
